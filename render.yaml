# Render settings for the static site "bhanetwork-site" (srv-dao309oae00c73aj4uhg).
#
# The service was created in the dashboard, not from this Blueprint, so Render
# does not read this file automatically. It records the settings the site
# needs; the rules below must also exist on the service
# (Dashboard → bhanetwork-site → Redirects/Rewrites), in this order.
#
# Every route is pre-rendered to its own file (dist/index.html,
# dist/vfarm/index.html, dist/privacy/index.html, dist/terms/index.html), so a refresh on any of them
# works without a rule.
#
# /team is now a section of Home. The two redirects send old links there with
# a 301. Until they exist, dist/team/index.html does the same redirect in the
# browser (Render serves an existing file before it applies a rule, so that
# file answers /team either way; /team/anything is caught by the 301 or, via
# the 404 fallback, by the app).
services:
  - type: web
    runtime: static
    name: bhanetwork-site
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Caching (27 Sep): the build's own files carry a content hash in their
    # names, so browsers keep them for a year and never ask again; a new build
    # makes new names. Images keep a day and refresh in the background. Pages
    # themselves are always revalidated, so a deploy shows up on the next load.
    # Like the routes, these must also exist on the service
    # (Dashboard → bhanetwork-site → Headers).
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Security (27 Sep). HSTS deliberately leaves out subdomains: the
      # builders' hostnames (api.vfarm, cst, ...) get their TLS on their own
      # servers, and this site must not be able to break them.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    routes:
      - type: redirect
        source: /team
        destination: /#team
      - type: redirect
        source: /team/*
        destination: /#team
      - type: rewrite
        source: /*
        destination: /404.html
