<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <!--
      Runs before any CSS or paint: applies a remembered theme choice (the
      nav toggle writes it) so there is never a flash of the wrong theme, and
      marks the page as scripted so below-the-fold sections may fade in.
      Nothing else is stored; see /privacy.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('bha.theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
    <!-- ?v= makes browsers fetch the icons again when they change; bump it with them. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-config-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
